name: Build Lafz Daily APK


on:
  push:
    branches: [ main ]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > /tmp/upload-keystore.jks
          echo "KEYSTORE_PATH=/tmp/upload-keystore.jks" >> $GITHUB_ENV

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform=android-arm64 --dart-define=SUPABASE_URL=https://qetgxtjxsgmengtlqulj.supabase.co --dart-define=SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFldGd4dGp4c2dtZW5ndGxxdWxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MDk5MTIsImV4cCI6MjEwNzM4NTkxMn0.YII5OUEm7xo9tfZy9Zz1Dz5w1OfU1QRSCR2p-ZYWf6M
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lafz-daily-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
