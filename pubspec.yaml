publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  google_mobile_ads: ^7.0.0
  in_app_purchase: ^3.1.13
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^5.1.1
  timezone: ^0.9.4
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
